name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.10). Leave empty to auto-bump the patch number.'
        required: false
        default: ''
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Only when explicitly asked: a manual dispatch, or a push whose message contains [release]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: ver
        run: |
          set -e
          if [ -n "${{ github.event.inputs.version }}" ]; then
            new="${{ github.event.inputs.version }}"
          else
            cur=$(cat VERSION)
            IFS='.' read -r maj min pat <<< "$cur"
            pat=$((pat + 1))
            new="$maj.$min.$pat"
          fi
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Bump VERSION + README badge
        run: |
          set -e
          new="${{ steps.ver.outputs.new }}"
          echo "$new" > VERSION
          # scoped to the shields.io badge only — never rewrites 127.0.0.1 etc.
          sed -i -E "s#(badge/version-)[0-9]+\.[0-9]+\.[0-9]+#\1$new#g" README.md || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION README.md
          git commit -m "chore: release v$new [skip-release]" || echo "nothing to commit"
          git tag "v$new"
          git push origin main --follow-tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          new="${{ steps.ver.outputs.new }}"
          gh release create "v$new" --title "v$new" --generate-notes
