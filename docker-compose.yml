services:
  rcloneweb:
    image: ghcr.io/shaikhnedab/rcloneweb:latest
    # To build locally instead of using GHCR, uncomment:
    # build: .
    container_name: rcloneweb
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - HOST=0.0.0.0
      - PORT=8765
      - NODE_ENV=production
      - TZ=Asia/Kolkata
    volumes:
      - rcloneweb-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8765/api/auth/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Uncomment to use a host rclone config
    # - ./rclone.conf:/root/.config/rclone/rclone.conf:ro

  # Optional — Nginx reverse proxy with TLS termination inside compose
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/rcloneweb.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - rcloneweb

volumes:
  rcloneweb-data:
    name: rcloneweb-data
