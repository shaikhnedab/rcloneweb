# rcloneweb — Nginx (php-fpm, FULL SSL, deploy at "/")
# For raw nginx where you manage the vhost + certificate yourself.
# Save as /etc/nginx/sites-available/rcloneweb and symlink to sites-enabled,
# then:  sudo certbot certonly --nginx -d panel.example.com
#        sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name panel.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name panel.example.com;
    root /var/www/rcloneweb;
    index index.php;
    include mime.types;

    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ~ ^/(data|\.git|\.env) { deny all; return 404; }
    location ~ /\. { deny all; access_log off; log_not_found off; }

    location ^~ /css/ { alias /var/www/rcloneweb/public/css/; expires 7d; access_log off; add_header Cache-Control "public"; }
    location ^~ /js/  { alias /var/www/rcloneweb/public/js/;  expires 7d; access_log off; add_header Cache-Control "public"; }

    # PHP FIRST — so the API block's /api/index.php fallback executes (not static).
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param HTTPS on;   # app detects HTTPS -> Secure cookie + HSTS
        fastcgi_read_timeout 600;
        fastcgi_buffers 8 16k;
        fastcgi_buffer_size 32k;
        client_max_body_size 10M;
    }

    location / { try_files $uri $uri/ /index.php?$args; }

    # API/raw routing — AFTER \.php$ so the /api/index.php fallback executes.
    location ~ ^/(api|raw|i)(/|$) { try_files $uri /api/index.php?$args; }

    location ~ ^/data/.*\.php$ { deny all; return 404; }
}
