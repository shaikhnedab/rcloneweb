# rcloneweb — Nginx (php-fpm, deploy at "/")
# Save as /etc/nginx/sites-available/rcloneweb and symlink to sites-enabled,
# then `nginx -t && systemctl reload nginx`.

server {
    listen 80;
    server_name panel.example.com;
    root /var/www/rcloneweb;
    index index.php;
    include mime.types;

    # Security: block sensitive paths
    location ~ ^/(data|\.git|\.env) { deny all; return 404; }
    location ~ /\. { deny all; access_log off; log_not_found off; }

    # Static assets: /css/* -> public/css/*, /js/* -> public/js/*
    # Use ^~ so these prefix locations take precedence over regex
    location ^~ /css/ { alias /var/www/rcloneweb/public/css/; expires 7d; access_log off; add_header Cache-Control "public"; }
    location ^~ /js/  { alias /var/www/rcloneweb/public/js/;  expires 7d; access_log off; add_header Cache-Control "public"; }

    # IMPORTANT: route /api, /raw, /i to the API front-controller BEFORE `location /`.
    # Without this, /api/auth/status is served as the SPA HTML shell and the app
    # fails to authenticate (and the SPA's fail-closed boot will show login).
    location ~ ^/(api|raw|i)(/|$) {
        try_files $uri /api/index.php?$args;
    }

    # Front controller (SPA shell for everything else)
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_read_timeout 600;
        fastcgi_buffers 8 16k;
        fastcgi_buffer_size 32k;
        client_max_body_size 10M;
    }

    location ~ ^/data/.*\.php$ { deny all; return 404; }
}
